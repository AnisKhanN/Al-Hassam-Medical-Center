services:
  # Backend API Service
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: smartclinic-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/smartclinic}
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-key-for-production-min-32-chars}
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=${CLIENT_URL:-http://localhost:80}
    volumes:
      - backend-uploads:/app/uploads

  # Frontend Web Service
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: smartclinic-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend-uploads:
