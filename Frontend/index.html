          {
            "@type": "MedicalBusiness",
            "name": "SmartClinic Healthcare Facility",
            "description": "Outpatient clinic and modern community pharmacy facility providing clinical consultations, electronic prescriptions, and diagnostic records.",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Sanghar",
              "addressRegion": "Sindh",
              "addressCountry": "PK"
            }
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Can SmartClinic be used in both single-doctor clinics and multi-specialty hospitals?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. SmartClinic is built with multi-role Role-Based Access Control (RBAC). Whether you are a solo practitioner managing appointments and billing or a multi-department healthcare facility with separate doctors, reception desks, and an attached pharmacy, SmartClinic adapts seamlessly."
                }
              },
              {
                "@type": "Question",
                "name": "How does the AI Assistant work without constant external internet connectivity?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "SmartClinic features a Dual-Engine AI Architecture. While it connects to Google Gemini and OpenAI LLMs when internet is available, it includes a built-in deterministic Heuristic Analytics Engine that answers queries, parses prescription text, and audits records completely offline."
                }
              },
              {
                "@type": "Question",
                "name": "How are roles and medical records secured in SmartClinic?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Security is strictly enforced via cryptographically signed JWT tokens, BCrypt password hashing, and role middleware across 4 tiers: Admin, Doctor, Receptionist, and Pharmacist. Non-admin users cannot access administrative financials, and non-clinical users cannot view sensitive diagnostic notes."
                }
              },
              {
                "@type": "Question",
                "name": "What payment methods are supported for clinic and pharmacy billing?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "The billing system supports direct Cash, Credit/Debit Cards, Bank Transfers, and local mobile wallets including JazzCash and EasyPaisa, with real-time balance tracking, split payments, and thermal receipt printing."
                }
              },
              {
                "@type": "Question",
                "name": "How does automated FEFO inventory management work?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "SmartClinic uses First-Expiry-First-Out (FEFO) inventory algorithms. When dispensing medicines at the POS counter, the system automatically pulls from batches with the earliest expiry dates first, preventing stock spoilage and expired drug waste."
                }
              }
            ]
          }
        ]
      }
